[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc-cloud"
version = "0.1.0"
description = "ARC CLOUD Software X-Ray CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "ARC CLOUD Team", email = "support@arc-cloud.dev" }
]
keywords = [
    "cli",
    "software-blueprint",
    "x-ray",
    "static-analysis",
    "project-scanner",
    "architecture",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities"
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "build>=1.1.0",
    "twine>=5.0.0"
]

[project.scripts]
arc = "arc_cloud.main:app"

[project.urls]
Homepage = "https://github.com/ARC-CLOUD/arc-cloud-cli"
Documentation = "https://github.com/ARC-CLOUD/arc-cloud-cli#readme"
Repository = "https://github.com/ARC-CLOUD/arc-cloud-cli"
Issues = "https://github.com/ARC-CLOUD/arc-cloud-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["arc_cloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["fixtures", ".venv", "tests/fixtures"]
addopts = "-v --strict-markers --ignore=tests/fixtures"
